<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aperçu · la Room</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#f1f0ec; --ink:#14171c; --muted:#5b6270; --line:#e3e6ea;
  --brand:#2350d8; --brand-soft:#e6ecfd;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/26px 'Open Sans',Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:40px 16px 56px}
.scene{position:relative;border-radius:28px;overflow:hidden;padding-bottom:0;
  background:radial-gradient(60% 70% at 50% 46%,#ffffff 0%,#f6f7fb 45%,#eceef4 100%);
  box-shadow:0 30px 60px -24px rgba(20,23,28,.35)}
.stage{position:relative;aspect-ratio:16/9}
.scene canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.p{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:14px;
  background:rgba(255,255,255,.92);box-shadow:0 1px 2px rgba(20,23,28,.08),0 6px 18px -6px rgba(20,23,28,.22);
  white-space:nowrap;will-change:transform,opacity;transform-origin:0 50%}
.p .i{flex:none;width:28px;height:28px;border-radius:9px;background:#f1f3f8;display:grid;place-items:center;color:var(--ink)}
.p .i svg{width:17px;height:17px}
.p b{display:block;font:600 13px/17px 'Open Sans',Arial,sans-serif;color:var(--ink)}
.p span.d{display:block;font:400 12px/16px 'Open Sans',Arial,sans-serif;color:var(--muted)}
.p .ok{margin-left:4px;font:600 11px/16px 'Open Sans',Arial,sans-serif;color:var(--brand);background:var(--brand-soft);padding:2px 7px;border-radius:999px}
.p.src{background:var(--brand);box-shadow:0 10px 28px -8px rgba(35,80,216,.55)}
.p.src .i{background:rgba(255,255,255,.18);color:#fff}
.p.src b{color:#fff}.p.src span.d{color:#dbe4ff}
.cap{position:absolute;left:28px;right:28px;bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none}
.cap .t{max-width:46ch;font:400 15px/23px 'Open Sans',Arial,sans-serif;color:var(--muted)}
.cap .t b{color:var(--ink);font-weight:600}
.cap .n{font:600 13px/18px 'Open Sans',Arial,sans-serif;color:var(--brand);background:#fff;border-radius:999px;padding:8px 14px;box-shadow:0 1px 2px rgba(20,23,28,.08),0 6px 18px -6px rgba(20,23,28,.2)}
.room{position:absolute;left:24px;top:20px;display:flex;align-items:center;gap:8px;font:600 14px/20px 'Open Sans',Arial,sans-serif;color:var(--ink)}
.room small{font-weight:400;color:var(--muted);font-size:13px}
@media (max-width:720px){
  .scene{border-radius:22px;padding-bottom:16px}
  .p .d{display:none!important}.p{padding:4px 8px 4px 4px;gap:6px}.p .i{width:24px;height:24px}
  .cap{position:static;flex-direction:column;align-items:flex-start;padding:4px 4px 0}.cap .t{font-size:14px;line-height:21px}
  .stage{aspect-ratio:4/5}
  .room{left:16px;top:14px}.room small{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="scene" id="scene" role="img" aria-label="">
    <div class="room"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2350d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="roomName"></span><small>chiffrée de bout en bout</small></div>
    <div class="stage" id="stage"><div class="labels" id="labels"></div></div>
    <div class="cap"><div class="t" id="capText"></div><div class="n" id="capCount"></div></div>
  </div>
</div>

<script type="module">
import * as THREE from '/vendor/three-0.160.0.module.min.js';

/* ---------- Registre : ajouter une scène ou un participant = ajouter une entrée ---------- */
const ROOM = {
  nom: 'Room « Production »',
  delai: '0,8 s',
  scenes: [
    { source: 'datacenter', quoi: 'la carte des routes mise à jour',
      texte: "Le data center publie <b>une seule fois</b> la carte des routes. Tous les membres de la Room la reçoivent <b>au même instant</b>, en direct entre eux." }
  ],
  participants: [
    { id:'datacenter', nom:'Data center',     detail:'publie la carte v42',          icone:'datacenter', lat: 0,  lon:0 },
    { id:'drone',      nom:'Drone',           detail:'ajuste son plan de vol',       icone:'drone',      az:90, ecart:60 },
    { id:'voiture',    nom:'Voiture',         detail:"recalcule l'itinéraire",       icone:'voiture',    az:18, ecart:60 },
    { id:'camion',     nom:'Camion',          detail:'reçoit sa tournée',            icone:'camion',     az:-40, ecart:62 },
    { id:'telephone',  nom:'Téléphone',       detail:'prévient le livreur',          icone:'telephone',  az:-126, ecart:60  },
    { id:'ordi',       nom:'Ordinateur',      detail:'tableau de bord à jour',       icone:'ordi',       az:162, ecart:60 },
    { id:'navigateur', nom:'Navigateur',      detail:'page de suivi actualisée',     icone:'navigateur', az:-18, ecart:50 },
    { id:'client',     nom:'Client',          detail:'voit sa livraison',            icone:'client',     az:54, ecart:50 },
    { id:'agent',      nom:'Agent IA',        detail:'replanifie les livraisons',    icone:'agent',      az:126, ecart:50  },
    { id:'gpu',        nom:'Serveur GPU',     detail:'réentraîne le modèle',         icone:'serveur',    az:198, ecart:50 },
    { id:'dataset',    nom:'Dataset',         detail:'nouvelle version',             icone:'dataset',    az:-98, ecart:50 },
    { id:'base',       nom:'Base de données', detail:"enregistre l'événement",       icone:'base',       lat: 42,  lon:-128 },
    { id:'bucket',     nom:'Bucket S3',       detail:'archive la carte',             icone:'bucket',     lat:-28,  lon:132 }
  ]
};

const ICONES = {
  datacenter:'<rect x="4" y="3" width="16" height="5" rx="1.5"/><rect x="4" y="10" width="16" height="5" rx="1.5"/><rect x="4" y="17" width="16" height="4" rx="1.5"/><path d="M8 5.5h.01M8 12.5h.01"/>',
  drone:'<circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M7 8l2.5 2.5M17 8l-2.5 2.5M7 16l2.5-2.5M17 16l-2.5-2.5"/>',
  voiture:'<path d="M5 16V12l2-5h10l2 5v4"/><path d="M3 16h18v2H3z"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/><path d="M5 12h14"/>',
  camion:'<path d="M2 6h11v10H2z"/><path d="M13 9h4l3 3.5V16h-7z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/>',
  telephone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  ordi:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  navigateur:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8.5h18"/><path d="M6 6.3h.01M8.5 6.3h.01"/>',
  client:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c1-3.8 3.8-5.8 7-5.8s6 2 7 5.8"/>',
  agent:'<path d="M9 3h6M12 3v3"/><rect x="5" y="6" width="14" height="12" rx="4"/><circle cx="9.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><path d="M9.5 15.3h5"/>',
  serveur:'<rect x="4" y="4" width="16" height="7" rx="1.8"/><rect x="4" y="13" width="16" height="7" rx="1.8"/><path d="M8 7.5h.01M8 16.5h.01"/>',
  dataset:'<path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>',
  base:'<ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/>',
  bucket:'<path d="M4 6h16l-1.6 12.4A2 2 0 0 1 16.4 20H7.6a2 2 0 0 1-2-1.6L4 6z"/><ellipse cx="12" cy="6" rx="8" ry="2"/>'
};

/* ---------- Mise en place ---------- */
const host = document.getElementById('stage'), labels = document.getElementById('labels');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(0, 0, 4.4);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
host.prepend(renderer.domElement);

const room = new THREE.Group(); room.rotation.x = 0.28; scene.add(room);
const R = 1;
const BLEU = new THREE.Color('#2350d8');

function surface(lat, lon, r = R){
  const a = THREE.MathUtils.degToRad(lat), b = THREE.MathUtils.degToRad(lon);
  return new THREE.Vector3(r*Math.cos(a)*Math.sin(b), r*Math.sin(a), r*Math.cos(a)*Math.cos(b));
}

/* La bulle : une coque de verre (bord lumineux) + une trame de points (la membrane de la Room). */
const coque = new THREE.Mesh(
  new THREE.SphereGeometry(R, 96, 64),
  new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{ c:{ value:BLEU } },
    vertexShader:'varying vec3 n; varying vec3 v; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); n = normalize(normalMatrix*normal); v = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }',
    fragmentShader:'uniform vec3 c; varying vec3 n; varying vec3 v; void main(){ float f = pow(1.-max(dot(n,v),0.),2.6); gl_FragColor = vec4(c, .025 + f*.32); }'
  })
);
scene.add(coque);

const N = 2200, pts = new Float32Array(N*3);
for(let i=0;i<N;i++){ const y = 1 - (i/(N-1))*2, r = Math.sqrt(1-y*y), th = Math.PI*(3-Math.sqrt(5))*i; pts.set([Math.cos(th)*r*R, y*R, Math.sin(th)*r*R], i*3); }
const trame = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pts,3)),
  new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, uniforms:{ c:{ value:BLEU }, px:{ value:renderer.getPixelRatio() } },
    vertexShader:'uniform float px; varying float a; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); vec3 n = normalize(normalMatrix*normalize(position)); a = .05 + .30*pow(1.-abs(dot(n, normalize(-mv.xyz))),1.6); gl_PointSize = 1.9*px; gl_Position = projectionMatrix*mv; }',
    fragmentShader:'uniform vec3 c; varying float a; void main(){ vec2 q = gl_PointCoord-.5; if(dot(q,q)>.25) discard; gl_FragColor = vec4(c, a); }'
  }));
room.add(trame);

/* Participants : un point sur la membrane + une étiquette HTML. */
function autour(az, ecart){ const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(ecart);
  return new THREE.Vector3(Math.sin(e)*Math.cos(a), Math.sin(e)*Math.sin(a), Math.cos(e)).multiplyScalar(R); }
const P = ROOM.participants.map(p => ({ ...p, pos: p.az !== undefined ? autour(p.az, p.ecart) : surface(p.lat, p.lon) }));
const scn = ROOM.scenes[0], src = P.find(p => p.id === scn.source);
const nRecus = P.length - 1;
P.forEach(p => {
  const estSrc = p === src;
  const m = new THREE.Mesh(new THREE.SphereGeometry(estSrc ? .034 : .024, 24, 16), new THREE.MeshBasicMaterial({ color: BLEU }));
  m.position.copy(p.pos); room.add(m);
  const halo = new THREE.Mesh(new THREE.RingGeometry(.045, .062, 48), new THREE.MeshBasicMaterial({ color:BLEU, transparent:true, opacity: estSrc ? .5 : .28, side:THREE.DoubleSide, depthWrite:false }));
  halo.position.copy(p.pos); halo.lookAt(p.pos.clone().multiplyScalar(2)); room.add(halo);
  const div = document.createElement('div');
  div.className = 'p' + (estSrc ? ' src' : '');
  div.innerHTML = '<span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONES[p.icone]+'</svg></span><span><b>'+p.nom+'</b><span class="d">'+p.detail+'</span></span>' + (estSrc ? '' : '<span class="ok">reçu</span>');
  labels.appendChild(div); p.el = div;
});

/* L'envoi : un trajet direct de la source vers CHAQUE membre, tous de la même durée → arrivée simultanée. */
P.filter(p => p !== src).forEach(p => {
  const mid = src.pos.clone().add(p.pos).multiplyScalar(.5);
  const ctrl = mid.clone().multiplyScalar(.55);          // la courbe passe à l'intérieur de la bulle
  const courbe = new THREE.QuadraticBezierCurve3(src.pos, ctrl, p.pos);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(courbe, 64, .0036, 8, false),
    new THREE.MeshBasicMaterial({ color:BLEU, transparent:true, opacity:.55, depthWrite:false }));
  room.add(tube);
  // Le paquet, figé à l'instant d'arrivée (même instant pour tous).
  const tete = new THREE.Mesh(new THREE.SphereGeometry(.016, 16, 12), new THREE.MeshBasicMaterial({ color:BLEU }));
  tete.position.copy(courbe.getPoint(.94)); room.add(tete);
});

document.getElementById('roomName').textContent = ROOM.nom;
document.getElementById('capText').innerHTML = scn.texte;
document.getElementById('capCount').textContent = nRecus + ' / ' + nRecus + ' reçus en ' + ROOM.delai;
document.getElementById('scene').setAttribute('aria-label', ROOM.nom + '. ' + src.nom + ' publie ' + scn.quoi + ' ; ' + nRecus + ' participants la reçoivent en même temps.');

/* ---------- Rendu ---------- */
const v = new THREE.Vector3(), cam = new THREE.Vector3(); let cx = .5;
function taille(){
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  const etroit = w/h < 1;
  camera.position.z = etroit ? 5.2 : 4.6;
  room.position.x = coque.position.x = etroit ? 0 : .42;  // grand écran : bulle à droite, légende à gauche
  room.position.y = coque.position.y = etroit ? .12 : .05;
  cx = .5 + (etroit ? 0 : .07);
  camera.updateProjectionMatrix();
}
function etiquettes(){
  const w = host.clientWidth, h = host.clientHeight;
  camera.getWorldPosition(cam);
  P.forEach(p => {
    v.copy(p.pos).applyMatrix4(room.matrixWorld);
    p.face = p === src ? 9 : v.clone().normalize().dot(cam.clone().sub(v).normalize());
  });
  const poses = [];
  [...P].sort((a,b) => b.face - a.face).forEach(p => {
    v.copy(p.pos).applyMatrix4(room.matrixWorld);
    const face = v.clone().normalize().dot(cam.clone().sub(v).normalize());   // >0 : face à nous
    v.project(camera);
    const x = (v.x*.5+.5)*w, y = (-v.y*.5+.5)*h;
    const estSrc = p === src, etroit = w < 721;
    let o = estSrc ? 1 : THREE.MathUtils.clamp(.45 + face*2.2, 0, 1);
    if(!estSrc && face < (etroit ? .1 : -.02)) o = 0;   // à l'arrière de la bulle : le point seul, sans étiquette
    const s = estSrc ? 1 : .82 + .18*THREE.MathUtils.clamp(face*2, 0, 1);
    const gauche = !estSrc && x < w*cx;
    p.el.style.opacity = o.toFixed(3);
    p.el.style.zIndex = estSrc ? 300 : Math.round(100 + face*100);
    p.el.style.transformOrigin = gauche ? '100% 50%' : '0 50%';
    const dx = estSrc ? -p.el.offsetWidth/2 : (gauche ? -p.el.offsetWidth - 12 : 12), dy = estSrc ? 14 : -p.el.offsetHeight/2;
    const lx = THREE.MathUtils.clamp(x+dx, 8, w - p.el.offsetWidth - 8);       // l'étiquette reste dans le cadre
    const bw = p.el.offsetWidth*s, bh = p.el.offsetHeight*s, by = y+dy;
    if(o > 0 && poses.some(q => lx < q[0]+q[2]+4 && q[0] < lx+bw+4 && by < q[1]+q[3]+4 && q[1] < by+bh+4)) o = 0;
    if(o > 0) poses.push([lx, by, bw, bh]);
    p.el.style.opacity = o.toFixed(3);
    p.el.style.transform = 'translate('+lx.toFixed(1)+'px,'+by.toFixed(1)+'px) scale('+s.toFixed(3)+')';
  });
}
const calme = matchMedia('(prefers-reduced-motion: reduce)').matches || new URLSearchParams(location.search).has('fixe');
let t0 = performance.now();
function boucle(t){
  if(!calme) room.rotation.y = Math.sin((t - t0)/9000)*0.22;   // lent balancement, la scène reste lisible
  renderer.render(scene, camera); etiquettes();
  if(!calme) requestAnimationFrame(boucle);
}
addEventListener('resize', () => { taille(); if(calme) boucle(0); });
taille(); room.rotation.y = 0; room.updateMatrixWorld(); boucle(0);
if(calme) requestAnimationFrame(() => boucle(0));
</script>
</body>
</html>
