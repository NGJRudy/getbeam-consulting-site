<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>BEAM · Académie</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root{--ink:#14171c;--muted:#5b6270;--line:#e3e6ea;--surface:#f4f5f7;--card:#fff;--brand:#2350d8;--brand-soft:#eef2fd;--ok:#1a7f4b;--ok-soft:#e6f4ec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--ink);font:400 16px/24px 'Open Sans',Arial,sans-serif}
main{width:min(560px,100%);margin:0 auto;padding:16px 16px 48px}
.haut{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 4px 18px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:600 20px/1 'Open Sans',Arial,sans-serif;letter-spacing:.14em}
.langue{display:flex;border:1px solid var(--line);border-radius:999px;background:#fff;padding:2px}
.langue button{border:0;background:none;font:600 13px/20px 'Open Sans',Arial,sans-serif;padding:6px 12px;border-radius:999px;color:var(--muted);cursor:pointer;min-height:36px}
.langue button[aria-pressed="true"]{background:var(--ink);color:#fff}
.card{background:var(--card);border-radius:16px;padding:22px 20px;margin:0 0 16px;box-shadow:0 12px 32px -20px rgba(20,23,28,.35)}
h1{font-size:24px;line-height:32px;margin:0 0 4px}
h2{font-size:18px;line-height:26px;margin:0}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.progres{margin:16px 0 0}
.barre{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.barre i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.progres p{font-size:14px;color:var(--muted);margin:6px 0 0}
.suivant{display:block;margin:16px 0 0;padding:14px 16px;border-radius:12px;background:var(--brand-soft);color:var(--ink);text-decoration:none}
.suivant small{display:block;font-size:13px;color:var(--brand);font-weight:600}
.suivant b{display:block;font-size:16px;line-height:23px}
.doc{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0}
.num{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.doc.lu .num{background:var(--ok);border-color:var(--ok);color:#fff}
.doc h3{font-size:16px;line-height:23px;margin:2px 0 0}
.doc p{font-size:14px;line-height:21px;color:var(--muted);margin:2px 0 0}
.meta{font-size:13px;color:var(--muted);margin:4px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border-radius:12px;font:600 15px/22px 'Open Sans',Arial,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.prim{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.fait{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.bientot{display:inline-block;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 10px;margin:8px 0 0}
.msg{font-size:15px;color:var(--muted);margin:12px 0 0}
.pied{font-size:14px;color:var(--muted);text-align:center;margin:8px 0 0}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main>
<div class="haut">
  <a class="brand" href="/" target="_blank" rel="noopener"><img src="/assets/email/beam-logo-96.png" width="32" height="32" alt="">BEAM</a>
  <div class="langue" role="group" aria-label="Langue / Language">
    <button type="button" data-l="fr" aria-pressed="true">FR</button>
    <button type="button" data-l="en" aria-pressed="false">EN</button>
  </div>
</div>

<section class="card">
  <h1 data-t="titre">Académie BEAM</h1>
  <p class="sub" data-t="intro">Toutes les formations BEAM, au même endroit. Lisez-les dans l’ordre, puis revenez à la boîte à outils quand vous en avez besoin.</p>
  <div class="progres" id="progres" hidden>
    <div class="barre" aria-hidden="true"><i id="barre"></i></div>
    <p id="p-txt"></p>
  </div>
  <a class="suivant" id="suivant" hidden></a>
  <p class="msg" id="m" role="status"></p>
</section>

<div id="sections"></div>

<p class="pied"><a href="/consultants/mon-qr/" data-t="retour">Retour à mon espace</a> · <a href="mailto:team@getbeam-consulting.com" data-t="aide">Une question ? team@getbeam-consulting.com</a></p>
</main>
<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };
  var CLE='beam-consultant', CLE_LU='beam-academie-lu', CLE_L='beam-academie-langue';
  var ID=/^[a-z0-9]{2,30}$/, JETON=/^[A-Za-z0-9_-]{16,128}$/;
  var T={
    fr:{titre:'Académie BEAM',intro:'Toutes les formations BEAM, au même endroit. Lisez-les dans l’ordre, puis revenez à la boîte à outils quand vous en avez besoin.',
        retour:'Retour à mon espace',aide:'Une question ? team@getbeam-consulting.com',ouvrir:'Ouvrir',lire:'Lire',lu:'Marquer comme lu',fait:'Lu',min:' min',bientot:'Bientôt disponible',
        enfr:' (en français)',suivant:'Votre prochaine étape',bravo:'Vous avez tout lu. Gardez la boîte à outils sous la main.',attente:'Les prochains modules arrivent bientôt. En attendant, la boîte à outils est à vous.',progres:function(n,t){ return n+' sur '+t+' lus'; },
        acces:'Cette page s’ouvre depuis votre espace consultant. Ouvrez-le avec le bouton de votre e-mail BEAM, puis revenez ici.',ferme:'L’académie n’est pas disponible pour le moment.'},
    en:{titre:'BEAM Academy',intro:'All BEAM training in one place. Read it in order, then come back to the toolbox whenever you need it.',
        retour:'Back to my space',aide:'Questions? team@getbeam-consulting.com',ouvrir:'Open',lire:'Read',lu:'Mark as read',fait:'Read',min:' min',bientot:'Coming soon',
        enfr:' (in French)',suivant:'Your next step',bravo:'You have read everything. Keep the toolbox at hand.',attente:'The next modules are coming soon. In the meantime, the toolbox is yours.',progres:function(n,t){ return n+' of '+t+' read'; },
        acces:'This page opens from your consultant space. Open it with the button in your BEAM e-mail, then come back here.',ferme:'The academy is not available right now.'}
  };
  var L='fr', cfg=null, lu={};
  try{ var l0=localStorage.getItem(CLE_L); if(l0==='en'||l0==='fr') L=l0; else if((navigator.language||'').slice(0,2)==='en') L='en'; }catch(e){}
  try{ lu=JSON.parse(localStorage.getItem(CLE_LU)||'{}')||{}; }catch(e){ lu={}; }
  function sauve(){ try{ localStorage.setItem(CLE_LU,JSON.stringify(lu)); }catch(e){} }
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function tx(o){ return o&&(o[L]||o.fr)||''; }
  function lien(d){ var f=d.fichier||{}; return f[L]||f.fr||''; }
  function sur(u){ return typeof u==='string'&&/^\/[A-Za-z0-9/_.\-]*$/.test(u); }

  function rendre(){
    document.documentElement.lang=L;
    [].forEach.call(document.querySelectorAll('[data-t]'),function(e){ var k=e.getAttribute('data-t'); if(typeof T[L][k]==='string') e.textContent=T[L][k]; });
    [].forEach.call(document.querySelectorAll('.langue button'),function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-l')===L?'true':'false'); });
    var S=$('sections'); S.textContent='';
    var dispo=cfg.documents.filter(function(d){ return sur(lien(d)); });
    var n=dispo.filter(function(d){ return lu[d.id]; }).length;
    $('progres').hidden=false; $('barre').style.width=(dispo.length?n/dispo.length*100:0)+'%'; $('p-txt').textContent=T[L].progres(n,dispo.length);
    var prochain=dispo.filter(function(d){ return d.section!=='outils'&&!lu[d.id]; })[0];
    var sv=$('suivant');
    if(prochain){ sv.hidden=false; sv.href=lien(prochain); sv.textContent=''; sv.appendChild(el('small',null,T[L].suivant)); sv.appendChild(el('b',null,tx(prochain.titre)+(prochain.minutes?' · '+prochain.minutes+T[L].min:''))); }
    else { var reste=cfg.documents.some(function(d){ return d.section!=='outils'&&!sur(lien(d)); }); sv.hidden=false; sv.removeAttribute('href'); sv.textContent=''; sv.appendChild(el('b',null,reste?T[L].attente:T[L].bravo)); }

    cfg.sections.forEach(function(s){
      var docs=cfg.documents.filter(function(d){ return d.section===s.id; });
      if(!docs.length) return;
      var c=el('section','card'); c.appendChild(el('h2',null,tx(s.titre))); c.appendChild(el('p','sub',tx(s.resume)));
      docs.forEach(function(d,i){
        var u=lien(d), ok=sur(u), seulFr=L==='en'&&!(d.fichier&&d.fichier.en)&&ok;
        var r=el('div','doc'+(lu[d.id]?' lu':''));
        r.appendChild(el('span','num',lu[d.id]?'✓':String(i+1)));
        var b=el('div');
        b.appendChild(el('h3',null,tx(d.titre)));
        if(tx(d.resume)) b.appendChild(el('p',null,tx(d.resume)));
        if(d.minutes) b.appendChild(el('p','meta',d.minutes+T[L].min+(seulFr?T[L].enfr:'')));
        if(ok){
          var act=el('div','actions');
          var o=el('a','btn'+(lu[d.id]?'':' prim'),d.type==='pdf'?T[L].lire:T[L].ouvrir); o.href=u; if(d.type==='pdf'){ o.target='_blank'; o.rel='noopener'; }
          o.addEventListener('click',function(){ lu[d.id]=1; sauve(); setTimeout(rendre,300); });
          var m=el('button','btn'+(lu[d.id]?' fait':''),lu[d.id]?T[L].fait:T[L].lu); m.type='button';
          m.onclick=function(){ if(lu[d.id]) delete lu[d.id]; else lu[d.id]=1; sauve(); rendre(); };
          act.appendChild(o); act.appendChild(m); b.appendChild(act);
        } else b.appendChild(el('span','bientot',T[L].bientot));
        r.appendChild(b); c.appendChild(r);
      });
      S.appendChild(c);
    });
  }
  [].forEach.call(document.querySelectorAll('.langue button'),function(b){ b.onclick=function(){ L=b.getAttribute('data-l'); try{ localStorage.setItem(CLE_L,L); }catch(e){} if(cfg) rendre(); }; });

  var a='',t='';
  try{ var s=JSON.parse(localStorage.getItem(CLE)||'null'); if(s){ a=s.a; t=s.t; } }catch(e){}
  if(!ID.test(a)||!JETON.test(t)){ $('m').textContent=T[L].acces; return; }
  Promise.all([
    fetch('/x/consultants.json',{cache:'no-cache'}).then(function(r){ return r.json(); }),
    fetch('/x/academie.json',{cache:'no-cache'}).then(function(r){ return r.json(); })
  ]).then(function(v){
    var c=v[0]; cfg=v[1];
    if(!c.webhook||!cfg||!Array.isArray(cfg.documents)) throw new Error('ferme');
    return fetch(c.webhook,{method:'POST',body:new URLSearchParams({action:'verification',id:a,jeton:t})}).then(function(r){ return r.json(); }).then(function(j){
      if(!j||j.ok!==true){ try{ localStorage.removeItem(CLE); }catch(e){} $('m').textContent=T[L].acces; return; }
      rendre();
    });
  }).catch(function(){ $('m').textContent=T[L].ferme; });
})();
</script>
</body></html>
