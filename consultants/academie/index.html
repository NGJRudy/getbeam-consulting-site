<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>BEAM · Académie</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/consultants/academie/academie.css?v=2">
<style>
/* Prochaine étape */
.suite{display:grid;gap:16px;margin:18px 0 0;color:var(--ink);text-decoration:none}
.suite small{display:block;font-size:13px;font-weight:600;color:var(--brand)}
.suite .t{display:block;font:400 30px/1.05 var(--serif);margin:4px 0 0}
.suite .m{display:block;font-size:14px;color:var(--muted);margin:6px 0 0}
.suite .barre{margin:10px 0 0}
.suite .btn{margin:14px 0 0}
.suite .couv{transition:transform .2s}
a.suite:hover .couv{transform:translateY(-2px)}
.fin{margin:16px 0 0;padding:14px 16px;border-radius:12px;background:var(--brand-soft);font-size:15px}
@media (min-width:640px){.suite{grid-template-columns:1.15fr 1fr;align-items:center}}

/* Parcours : une couverture par module */
.modules{display:grid;gap:20px;margin:18px 0 0;grid-template-columns:1fr}
@media (min-width:560px){.modules{grid-template-columns:repeat(2,1fr)}}
.mod{display:flex;flex-direction:column;color:var(--ink);text-decoration:none}
.mod .infos{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0}
.mod .meta{font-size:13px;color:var(--muted)}
.mod h3{font:400 26px/1.08 var(--serif);margin:6px 0 0}
.mod p{font-size:14px;line-height:21px;color:var(--muted);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mod .barre{margin:10px 0 0}
.mod.bientot .couv{filter:saturate(.35);opacity:.75}
a.mod:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}

/* Lignes : se repérer et boîte à outils */
.ligne{display:grid;grid-template-columns:44px 1fr 20px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.ligne:first-of-type{border-top:0}
.ligne .ic{width:44px;height:44px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.ligne .ic svg{width:22px;height:22px}
.ligne.lu .ic{background:var(--ok-soft);color:var(--ok)}
.ligne b{display:block;font-size:16px;line-height:22px}
.ligne span.r{display:block;font-size:14px;line-height:20px;color:var(--muted);margin:2px 0 0}
.ligne .chev{color:var(--muted)}
.liste{margin:8px 0 0}
</style></head>
<body><main>
<div class="haut">
  <span class="brand"><img src="/assets/email/beam-logo-96.png" width="32" height="32" alt="">BEAM</span>
  <div class="langue" role="group" aria-label="Langue / Language">
    <button type="button" data-l="fr" aria-pressed="true">FR</button>
    <button type="button" data-l="en" aria-pressed="false">EN</button>
  </div>
</div>

<section class="card">
  <h1 data-t="titre">Académie BEAM</h1>
  <p class="sub" data-t="intro"></p>
  <div class="progres" id="progres" hidden>
    <div class="barre" aria-hidden="true"><i id="barre"></i></div>
    <p id="p-txt"></p>
  </div>
  <div id="suite"></div>
  <p class="msg" id="m" role="status"></p>
</section>

<div id="sections"></div>

<p class="pied"><a href="mailto:team@getbeam-consulting.com" data-t="aide">Une question ? team@getbeam-consulting.com</a></p>
</main>
<script src="/consultants/academie/academie.js?v=3"></script>
<script>
(function(){
  'use strict';
  var A=window.Academie, el=A.el, $=function(id){ return document.getElementById(id); };
  var IC={
    page:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
    ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
  };
  function puce(d){
    var e=A.etat(d), p=A.pos[d.id], n=A.nbPages(d), txt;
    if(e==='lu') txt='✓ '+A.t('fait');
    else if(e==='encours') txt=A.T[A.L].encours(Math.min(p.p,n),n);
    else if(e==='bientot') txt=A.t('bientot');
    else txt=A.t('nouveau');
    return el('span','etat '+e,txt);
  }
  function avancement(d){ var p=A.pos[d.id], n=A.nbPages(d); if(!p||!n||A.lu[d.id]) return null;
    var b=el('div','barre'); b.setAttribute('aria-hidden','true'); var i=el('i'); i.style.width=Math.round(Math.min(p.max||p.p,n)/n*100)+'%'; b.appendChild(i); return b; }

  function carteModule(d){
    var ok=A.dispo(d), c=el(ok?'a':'div','mod'+(ok?'':' bientot'));
    if(ok) c.href=A.pageModule(d);
    c.appendChild(A.couverture(d));
    var inf=el('div','infos'); inf.appendChild(puce(d)); var m=A.meta(d); if(m&&ok) inf.appendChild(el('span','meta',m)); c.appendChild(inf);
    c.appendChild(el('h3',null,A.tx(d.titre)));
    if(A.tx(d.resume)) c.appendChild(el('p',null,A.tx(d.resume)));
    var b=avancement(d); if(b) c.appendChild(b);
    return c;
  }
  function ligne(d){
    var ok=A.dispo(d), r=el(ok?'a':'div','ligne'+(A.lu[d.id]?' lu':''));
    if(ok){ r.href=A.pageModule(d); r.addEventListener('click',function(){ if(d.type!=='pdf'){ A.lu[d.id]=1; A.sauve(); } }); }
    var ic=el('span','ic'); ic.innerHTML=A.lu[d.id]?IC.ok:(d.section==='demarrer'?IC.page:IC.doc); r.appendChild(ic);
    var t=el('span'); t.appendChild(el('b',null,A.tx(d.titre)));
    var x=[A.tx(d.resume)]; var m=ok?A.meta(d):A.t('bientot'); if(m) x.push(m);
    t.appendChild(el('span','r',x.filter(Boolean).join(' · '))); r.appendChild(t);
    var ch=el('span','chev'); if(ok) ch.innerHTML=IC.chev; r.appendChild(ch);
    return r;
  }

  function rendre(){
    A.traduire();
    var cfg=A.cfg, S=$('sections'); S.textContent='';
    var dispo=cfg.documents.filter(A.dispo), n=dispo.filter(function(d){ return A.lu[d.id]; }).length;
    $('progres').hidden=false; $('barre').style.width=(dispo.length?n/dispo.length*100:0)+'%'; $('p-txt').textContent=A.T[A.L].progres(n,dispo.length);

    /* Prochaine étape : le premier document du parcours (hors boîte à outils) pas encore lu. */
    var su=$('suite'); su.textContent='';
    var prochain=dispo.filter(function(d){ return d.section!=='outils'&&!A.lu[d.id]; })[0];
    if(prochain){
      var p=A.pos[prochain.id], np=A.nbPages(prochain), lecture=A.lecteur(prochain);
      var a=el('a','suite'); a.href=A.pageModule(prochain)+(lecture?'&lire=1':'');
      if(prochain.type==='pdf') a.appendChild(A.couverture(prochain,true));
      var tx=el('div'); tx.appendChild(el('small',null,A.t('suivant'))); tx.appendChild(el('span','t',A.tx(prochain.titre)));
      var m=A.meta(prochain); if(m) tx.appendChild(el('span','m',m));
      var b=avancement(prochain); if(b) tx.appendChild(b);
      var bt=el('span','btn prim',p&&p.p>1&&lecture?A.T[A.L].reprendre(Math.min(p.p,np)):(prochain.type==='pdf'?A.t('lire'):A.t('commencer')));
      tx.appendChild(bt); a.appendChild(tx);
      if(prochain.type!=='pdf') a.addEventListener('click',function(){ A.lu[prochain.id]=1; A.sauve(); });
      su.appendChild(a);
    } else {
      var reste=cfg.documents.some(function(d){ return d.section!=='outils'&&!A.dispo(d); });
      su.appendChild(el('p','fin',reste?A.t('attente'):A.t('bravo')));
    }

    cfg.sections.forEach(function(s){
      var docs=cfg.documents.filter(function(d){ return d.section===s.id; });
      if(!docs.length) return;
      var c=el('section','card'); c.appendChild(el('h2',null,A.tx(s.titre))); c.appendChild(el('p','sub',A.tx(s.resume)));
      var enCartes=docs.every(function(d){ return d.type==='pdf'; });
      var box=el('div',enCartes?'modules':'liste');
      docs.forEach(function(d){ box.appendChild(enCartes?carteModule(d):ligne(d)); });
      c.appendChild(box); S.appendChild(c);
    });
  }
  A.traduire();
  A.boutonsLangue(rendre);
  A.demarrer(rendre,function(msg){ $('m').textContent=msg; });
})();
</script>
<script src="/consultants/nav.js?v=1" defer></script>
</body></html>
